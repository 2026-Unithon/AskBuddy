# 운영 API 서버 구성. 비밀값은 저장소 밖 env 파일에만 둔다.
# 최상위 name 으로 프로젝트 이름을 고정해 폴더 위치가 바뀌어도 같은 컨테이너·볼륨을 쓴다.
name: askbuddy

services:
  api:
    build: ../api
    env_file: ${ASKBUDDY_ENV_FILE:-/home/ubuntu/askbuddy.env}
    volumes:
      - /home/ubuntu/askbuddy-releases:/run/askbuddy/releases:ro
    environment:
      PORT: "8000"
    restart: unless-stopped
    # 로그는 CloudWatch(/askbuddy/api, 30일 보존)로 보낸다. 리전은 env 파일이 아니라 배포 셸의 AWS_REGION 에서 온다
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION 이 필요하다}
        awslogs-group: /askbuddy/api
        awslogs-create-group: "true"
        tag: "api-{{.ID}}"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
