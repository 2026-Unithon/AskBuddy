name: Deploy checks
on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy-*.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 셸 스크립트 검사
        run: shellcheck -S warning deploy/remote_deploy.sh deploy/store9-gemini.sh deploy/demo-gemini.sh .github/scripts/*.sh .github/scripts/tests/*.sh
      - name: 배포 스크립트 테스트
        run: |
          bash .github/scripts/tests/ssm_deploy_test.sh
          bash .github/scripts/tests/backup_db_test.sh
      - name: compose 문법
        # 로그 드라이버(awslogs)가 리전을 요구한다. 실제 배포는 ssm_deploy.sh 가 워크플로의 AWS_REGION 을 넘긴다. 여기는 문법 검사용 값
        run: AWS_REGION=ap-northeast-2 ASKBUDDY_ENV_FILE=/dev/null docker compose -f deploy/compose.yml config -q
      - name: compose 는 리전 없이 배포되지 않는다
        run: |
          if ASKBUDDY_ENV_FILE=/dev/null docker compose -f deploy/compose.yml config -q 2>/dev/null; then
            echo "AWS_REGION 없이도 compose 가 통과했다(awslogs-region 필수 검사가 빠졌다)" >&2; exit 1
          fi
      - name: workflow 문법
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color .github/workflows/deploy-api.yml .github/workflows/deploy-checks.yml
